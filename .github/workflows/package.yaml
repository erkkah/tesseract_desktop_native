name: package
on: push

jobs:
  package-macos:
    runs-on: macos-latest
    steps:
      - name: install libs
        run: brew install tesseract leptonica

      - name: santity check
        run: find "${HOMEBREW_CELLAR}/tesseract"

      - name: copy libs
        run: |
          cp ${HOMEBREW_CELLAR}/tesseract/*/lib/libtesseract.a .
          cp ${HOMEBREW_CELLAR}/leptonica/*/lib/libleptonica.a .

      - name: store artifacts
        uses: actions/upload-artifact@v4
        with:
            name: macos
            path: |
              "libtesseract.a"
              "libleptonica.a"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    needs:
      - package-macos

    steps:
      - name: fetch artifacts
        uses: actions/download-artifact@v5
        with:
            name: macos

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libtesseract.a
            libleptonica.a
