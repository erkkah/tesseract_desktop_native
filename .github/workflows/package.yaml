name: package
on: push

jobs:
    package-macos:
        runs-on: macos-latest
        steps:
            - name: install libs
              run: brew install tesseract leptonica

            - name: Checkout
              uses: actions/checkout@v4

            - name: build
              run: |
                  mkdir -p build
                  cmake -B build -DSTATICS_ROOT=${HOMEBREW_PREFIX}/lib
                  cmake --build build

            - name: store artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: ${{ github.workspace }}/build/libtesseract.dylib

    package-windows:
        runs-on: windows-latest
        steps:
            - uses: msys2/setup-msys2@v2
              id: msys2
              with:
                  msystem: MINGW64
                  pacboy: >-
                      toolchain:p
                      cmake:p
                      ninja:p

            - name: install libs
              shell: msys2 {0}
              run: |
                  pacman --noconfirm -S mingw-w64-x86_64-leptonica
                  pacman --noconfirm -S mingw-w64-x86_64-tesseract-ocr

            - name: sanity check
              env:
                  MSYS2: ${{ steps.msys2.outputs.msys2-location }}
              run: |
                  dir ${{ github.workspace }}
                  dir "$env:MSYS2"

            - name: copy libs
              run: |
                  copy "${{ steps.msys2.outputs.msys2-location }}\mingw64\lib\libtesseract.a" ${{ github.workspace }}
                  copy "${{ steps.msys2.outputs.msys2-location }}\mingw64\lib\libleptonica.a" ${{ github.workspace }}

            - name: store artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: ${{ github.workspace }}\*.a

    release:
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest

        needs:
            - package-macos
            - package-windows

        steps:
            - name: fetch artifacts
              uses: actions/download-artifact@v5
              with:
                  name:
                    - macos
                    - windows

            - name: release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      libtesseract.dylib
                      libtesseract.dll
