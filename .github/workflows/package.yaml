name: package
on: push

jobs:
  package-macos:
    runs-on: macos-latest
    steps:
      - name: install libs
        run: brew install tesseract leptonica

      - name: copy libs
        run: |
          cp "${HOMEBREW_CELLAR}/tesseract/*/lib/tesseract.a" .
          cp "${HOMEBREW_CELLAR}/leptonica/*/lib/leptonica.a" .

      - name: store artifacts
        uses: actions/upload-artifact@v4
        with:
            name: macos
            path: |
              "tesseract.a"
              "leptonica.a"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    needs:
      - package-macos

    steps:
      - name: fetch artifacts
        uses: actions/download-artifact@v5
        with:
            name: macos

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tesseract.a
            leptonica.a
