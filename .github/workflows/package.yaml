name: package
on: push

jobs:
  package-macos:
    runs-on: macos-latest
    steps:
      - name: install libs
        run: brew install tesseract leptonica

      - name: copy libs
        run: |
          cp ${HOMEBREW_CELLAR}/tesseract/*/lib/libtesseract.a ${{ github.workspace }}
          cp ${HOMEBREW_CELLAR}/leptonica/*/lib/libleptonica.a ${{ github.workspace }}

      - name: store artifacts
        uses: actions/upload-artifact@v4
        with:
            name: macos
            path: |
              ${{ github.workspace }}/libtesseract.a
              ${{ github.workspace }}/libleptonica.a

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64

      - name: install libs
        shell: msys2 {0}
        run: |
          pacman --noconfirm -S mingw-w64-x86_64-leptonica
          pacman --noconfirm -S mingw-w64-x86_64-tesseract-ocr

      - name: sanity check
        run: |
          dir ${{ github.workspace }}
          dir C:\
          dir D:\

      - name: copy libs
        run: |
          copy C:\mingw64\lib\libtesseract.a ${{ github.workspace }}
          copy C:\mingw64\lib\libleptonica.a ${{ github.workspace }}

      - name: store artifacts
        uses: actions/upload-artifact@v4
        with:
            name: windows
            path: ${{ github.workspace }}\*.a

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    needs:
      - package-macos
      - package-windows

    steps:
      - name: fetch artifacts
        uses: actions/download-artifact@v5
        with:
            name: macos

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libtesseract.a
            libleptonica.a
